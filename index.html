  /* Water shimmer overlay on bottom half */
  .water-shimmer {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: 45%;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .water-shimmer canvas {
    width: 100%;
    height: 100%;
  }

  /* Dark overlay to keep text readable */
  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(13,31,92,0.55) 0%, rgba(13,31,92,0.3) 50%, rgba(13,31,92,0.6) 100%);
    z-index: 2;
  }

  .page {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 560px;
    width: 100%;
    gap: 0;
  }

  .logo-wrap {
    position: fixed;
    top: 28px;
    right: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  .logo-wrap img {
    width: clamp(40px, 6vw, 72px);
    height: clamp(40px, 6vw, 72px);
    object-fit: contain;
  }

  .wordmark {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--fg);
    margin-bottom: 10px;
  }

  .tagline {
    font-size: clamp(0.65rem, 1.8vw, 0.75rem);
    font-weight: 300;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 44px;
  }

  .divider {
    width: 36px;
    height: 1px;
    background: var(--border);
    margin-bottom: 44px;
  }

  .coming-soon {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    font-style: italic;
    font-weight: 400;
    color: var(--fg-soft);
    margin-bottom: 36px;
  }

  .notify-form {
    display: flex;
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--border);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 16px;
    backdrop-filter: blur(4px);
    background: rgba(13,31,92,0.3);
  }

  .notify-form input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.875rem;
    font-weight: 300;
    padding: 13px 16px;
    min-width: 0;
  }

  .notify-form input::placeholder { color: var(--fg-soft); }

  .notify-form button {
    background: rgba(255,255,255,0.9);
    color: #0D1F5C;
    border: none;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 13px 18px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .notify-form button:hover { opacity: 0.85; }

  .success-msg {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 300;
    min-height: 1.2em;
    margin-bottom: 4px;
  }

  .contact {
    margin-top: 44px;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--fg-soft);
  }

  .contact a {
    color: var(--accent);
    text-decoration: none;
  }

  @media (max-width: 480px) {
    .notify-form { flex-direction: column; }
    .notify-form button { padding: 11px; }
  }
</style>

  <h1 class="wordmark" style="font-size:clamp(1rem,2.5vw,1.7rem);letter-spacing:0.14em;margin:0;font-weight:400;">Visenex</h1>
  </div>

  <div style="position:fixed;bottom:clamp(40px,6vh,80px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:480px;padding:0 24px;">
    <p class="coming-soon" style="font-size:clamp(0.95rem,2vw,1.15rem);margin-bottom:0;">Something is being built here.</p>
    <form class="notify-form" id="notifyForm">
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" required>
      <button type="submit">Notify me</button>
    </form>
  </div>
  <p class="success-msg" id="successMsg"></p>

</div>

<script>
  // Email capture
  const form = document.getElementById('notifyForm');
  const msg = document.getElementById('successMsg');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const val = document.getElementById('emailInput').value.trim();
    if (!val) return;
    msg.textContent = 'Sending...';
    try {
      const res = await fetch('https://formspree.io/f/xljjwwqp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ email: val })
      });
      if (res.ok) {
        msg.textContent = 'Thank you. We will be in touch.';
        form.reset();
      } else {
        msg.textContent = 'Something went wrong. Please try again.';
      }
    } catch {
      msg.textContent = 'Something went wrong. Please try again.';
    }
  });

  // Water shimmer animation
  const canvas = document.getElementById('wc');
  const ctx = canvas.getContext('2d');
  let W, H, t = 0;

  function resize() {
    W = canvas.width = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawWater() {
    ctx.clearRect(0, 0, W, H);
    const lines = 18;
    for (let i = 0; i < lines; i++) {
      const y = (i / lines) * H;
      const alpha = 0.03 + (i / lines) * 0.06;
      const freq = 0.012 + i * 0.001;
      const speed = 0.4 + i * 0.05;
      const amp = 1.5 + i * 0.3;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const wy = y + Math.sin(x * freq + t * speed) * amp + Math.sin(x * freq * 1.7 + t * speed * 0.6) * amp * 0.4;
        x === 0 ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
      }
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    t += 0.012;
    requestAnimationFrame(drawWater);
  }
  drawWater();
</script>
